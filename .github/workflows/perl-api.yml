name: Perl API

on:
  push:
    paths:
      - ".github/workflows/perl-api.yml"
      - "**"
  pull_request:
    paths:
      - ".github/workflows/perl-api.yml"
      - "**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"

      - name: Install cpanminus
        run: curl -L https://cpanmin.us | perl - App::cpanminus

      - name: Install declared dependencies
        run: cpanm --installdeps --notest .

      - name: Validate package metadata
        run: perl -c Makefile.PL

      - name: Check client sources when present
        run: |
          if [ -f lib/Hlquery.pm ]; then
            perl Makefile.PL
            make test
          else
            echo "Perl client source tree not present under lib/; skipping module build/test."
          fi
